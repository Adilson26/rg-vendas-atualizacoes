name: Publicar RG Vendas e Estoque 1.5.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-1.5.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-rg-vendas-1.5.0
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Adilson26/rg-vendas-atualizacoes
      MANIFEST_B64: ''
      MIRRORS_B64: ''
      NOTES_B64: ''
    steps:
      - name: Baixar e conferir os dois instaladores preparados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,hashlib,pathlib,urllib.request,urllib.error,time
          manifest=json.loads(base64.b64decode(os.environ['MANIFEST_B64']))
          mirrors=json.loads(base64.b64decode(os.environ['MIRRORS_B64']))
          pathlib.Path('current.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('NOTAS.md').write_bytes(base64.b64decode(os.environ['NOTES_B64']))
          sums=[]
          for platform in ('windows','android'):
              release=manifest['releases'][platform]
              assert release['version']=='1.5.0'
              source=mirrors['files'][platform]
              assert source['sha256']==release['sha256'] and source['bytes']==release['bytes']
              name=release['url'].rsplit('/',1)[1]
              assert name in ('RG-Vendas-e-Estoque-Instalador-1.5.0.exe','RG-Vendas-e-Estoque-Android-1.5.0.apk')
              digest=hashlib.sha256(); size=0
              for attempt in range(30):
                  try:
                      response=urllib.request.urlopen(source['url'],timeout=180)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code!=404 or attempt==29: raise
                      print('Aguardando o endereço temporário ficar pronto...',flush=True)
                      time.sleep(15)
              with response, open(name,'wb') as output:
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk: break
                      output.write(chunk);digest.update(chunk);size+=len(chunk)
              assert size==release['bytes'] and digest.hexdigest()==release['sha256'],name
              sums.append(release['sha256']+'  '+name)
              print(name+': tamanho e SHA256 conferidos')
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          PY
      - name: Criar release e publicar somente depois dos anexos
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.5.0 --draft --target "$GITHUB_SHA" --title "RG Vendas e Estoque 1.5.0" --notes-file NOTAS.md RG-Vendas-e-Estoque-Instalador-1.5.0.exe RG-Vendas-e-Estoque-Android-1.5.0.apk current.json SHA256SUMS.txt
          gh release edit v1.5.0 --draft=false --latest
